name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Assemble downloadable install package
        run: |
          mkdir -p public/downloads .package
          cp package/README.md package/install.sh package/install.ps1 .package/
          cp public/chakravyuha_command_center.html backend/server.py backend/requirements.txt .package/
          (cd .package && zip -q -r ../public/downloads/chakravyuha-command-center-v3.7.1.zip .)
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Chakravyuha-ai-
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
